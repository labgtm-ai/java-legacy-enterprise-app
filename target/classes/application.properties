############################################################
# Application
############################################################

spring.application.name=legacy-employee-management-service
server.port=8080

spring.mvc.pathmatch.matching-strategy=ant_path_matcher

############################################################
# Logging
############################################################

logging.level.root=INFO
logging.level.com.company.legacy=DEBUG

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

############################################################
# Jackson
############################################################

spring.jackson.serialization.indent_output=true
spring.jackson.default-property-inclusion=non_null

############################################################
# Actuator
############################################################

management.security.enabled=false
endpoints.enabled=true
endpoints.health.enabled=true
endpoints.info.enabled=true

############################################################
# Swagger
############################################################


############################################################
# Legacy Application Properties
############################################################

legacy.report.location=./reports

legacy.report.fileName=employee-report.csv

legacy.sync.interval.seconds=30

legacy.max.employee.count=1000

legacy.company.name=ABC Corporation

legacy.company.location=New York

############################################################
# Banner
############################################################

spring.main.banner-mode=console